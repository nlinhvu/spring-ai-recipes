<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Recipe Inspector Timeline</title>
    <style>
        body { font:16px/1.5 system-ui,sans-serif; margin:24px; color:#202b29; background:#f8faf9; }
        main { max-width:1600px; margin:auto; }
        label,input,select,button { font:inherit; }
        input { max-width:100%; box-sizing:border-box; }
        button,select,input { margin:6px; padding:8px; }
        :focus-visible { outline:3px solid #165c97; outline-offset:3px; }
        .scroll { overflow:auto; background:white; border:1px solid #bfcac5; }
        table { border-collapse:collapse; width:100%; }
        th,td { text-align:left; padding:10px; border-bottom:1px solid #dce2df; vertical-align:top; min-width:90px; }
        code { white-space:pre-wrap; overflow-wrap:anywhere; }
        details { max-width:420px; min-width:220px; }
        summary { cursor:pointer; }
    </style>
</head>
<body>
<main>
    <h1>Recipe Inspector Timeline</h1>
    <p id="connection" role="status">Disconnected</p>
    <label>Demo token <input id="token" type="password" autocomplete="current-password"></label>
    <button id="connect" type="button">Connect / replay</button>
    <label>Run <select id="run" aria-label="Run"><option value="">No runs</option></select></label>
    <button id="clear" type="button">Clear server history</button>
    <p id="info" aria-live="polite"></p>
    <p>Scroll the table horizontally for all columns. Open event detail to inspect the stored JSON.</p>
    <section class="scroll" tabindex="0" aria-label="Event timeline">
        <table>
            <caption>Every retained event in the selected run</caption>
            <thead><tr><th scope="col">Source seq</th><th scope="col">Server seq</th><th scope="col">Time</th><th scope="col">Operation</th><th scope="col">Parent</th><th scope="col">Type</th><th scope="col">Detail</th></tr></thead>
            <tbody id="rows"></tbody>
        </table>
    </section>
</main>
<script type="module">
    import { createState, applyEvent, runOf, rowsFor } from './timeline.js';
    const byId = id => document.getElementById(id);
    let state = createState(), source, timer, dirty = false;
    function timeOf(event) {
        if (event.occurredAt != null) return String(event.occurredAt);
        const date = new Date(event.ts);
        return Number.isNaN(date.getTime()) ? String(event.ts ?? '') : date.toISOString();
    }
    function render() {
        dirty = false;
        const previous = byId('run').value;
        const runs = [...new Set([...state.events.values()].map(runOf))].sort();
        if (JSON.stringify(runs) !== JSON.stringify([...byId('run').options].map(option => option.value))) {
            byId('run').replaceChildren();
            for (const run of runs) {
                const option = document.createElement('option'); option.value = run; option.textContent = run;
                byId('run').append(option);
            }
            if (runs.includes(previous)) byId('run').value = previous;
        }
        const selected = byId('run').value;
        const { rows, capture } = rowsFor(state, selected);
        byId('info').textContent = `${rows.length} visible; ${state.events.size} retained in browser; ` +
            `${state.discarded} discarded by UI cap. Order: ${capture ? 'sourceSeq in this producer' : 'server arrival seq (capture order unavailable)'}. ` +
            'Reconnect replays only history still retained by the server.';
        const focused = document.activeElement;
        const focusedSeq = focused?.closest('tr')?.dataset.seq;
        const opened = new Set([...byId('rows').querySelectorAll('details[open]')].map(detail => detail.closest('tr').dataset.seq));
        const body = document.createDocumentFragment();
        for (const event of rows) {
            const tr = document.createElement('tr'); tr.dataset.seq = String(event.seq);
            const fields = [event.sourceSeq ?? '', event.seq, timeOf(event),
                event.operationId ?? event.callId ?? '', event.parentOperationId ?? event.parentId ?? '', event.kind ?? event.type ?? ''];
            for (const value of fields) {
                const td = document.createElement('td'); td.textContent = String(value); tr.append(td);
            }
            const td = document.createElement('td'), detail = document.createElement('details');
            detail.open = opened.has(String(event.seq));
            const summary = document.createElement('summary'), text = document.createElement('code');
            summary.textContent = 'Show event JSON'; text.textContent = JSON.stringify(event, null, 2);
            detail.append(summary, text); td.append(detail); tr.append(td); body.append(tr);
        }
        byId('rows').replaceChildren(body);
        if (focusedSeq && focused?.tagName === 'SUMMARY') {
            [...byId('rows').querySelectorAll('tr')].find(row => row.dataset.seq === focusedSeq)?.querySelector('summary')?.focus({ preventScroll: true });
        }
    }
    function connect() {
        source?.close(); clearInterval(timer);
        const token = byId('token').value;
        const query = token ? `?token=${encodeURIComponent(token)}` : '';
        source = new EventSource(`/api/stream${query}`);
        byId('connection').textContent = 'Connecting';
        source.onopen = () => {
            state = createState(); dirty = true;
            byId('connection').textContent = 'Connected; replaying retained history then live events';
        };
        source.onmessage = message => {
            try { applyEvent(state, JSON.parse(message.data)); dirty = true; }
            catch { byId('connection').textContent = 'Invalid event received'; }
        };
        source.onerror = () => { byId('connection').textContent = 'Disconnected; reconnecting (check token / server)'; };
        timer = setInterval(() => { if (dirty) render(); }, 200);
    }
    byId('connect').addEventListener('click', connect);
    byId('run').addEventListener('change', render);
    byId('clear').addEventListener('click', async () => {
        if (!window.confirm('Clear all server events and blobs?')) return;
        const token = byId('token').value;
        try {
            const response = await fetch('/api/events', { method:'DELETE', headers:token ? { 'X-Inspector-Token':token } : {} });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
        } catch (error) { byId('connection').textContent = `Clear failed: ${error.message}`; }
    });
    window.addEventListener('pageshow', event => { if (event.persisted) connect(); });
    window.addEventListener('pagehide', () => { source?.close(); clearInterval(timer); });
    connect();
</script>
</body>
</html>
