spring:
  application:
    name: mcp-client-plain

  ai:
    openai:
      api-key: ${GEMINI_API_KEY:}
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      chat:
        model: gemini-3.1-flash-lite

    mcp:
      client:
        stdio:
          connections:
            weathermcp:
              command: '/Users/linhvu/.sdkman/candidates/jbang/current/bin/jbang'
              args:
                - '/Users/linhvu/Desktop/spring-ai-recipes/jbang-mcp/mcp-server/McpStdioServerApplication.java'
                - '--spring.config.location=/Users/linhvu/Desktop/spring-ai-recipes/jbang-mcp/mcp-server/'
        root-change-notification: false

logging:
  level:
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: debug
    org.zalando: trace