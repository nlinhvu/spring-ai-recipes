spring:
  application:
    name: application

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        model: gpt-5-mini-2025-08-07
        temperature: 1.0
      audio:
        speech:
          model: tts-1
        transcription:
          model: whisper-1

    inspector:
      enabled: true