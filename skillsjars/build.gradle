dependencies {
	implementation 'org.springframework.ai:spring-ai-starter-model-openai'
	implementation 'org.springaicommunity:spring-ai-agent-utils'
	implementation 'com.skillsjars:anthropics__skills__pdf'
	runtimeOnly 'com.skillsjars:browser-use__browser-use__remote-browser'

	implementation 'org.zalando:logbook-spring-boot-starter'
	implementation 'org.zalando:logbook-okhttp'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
