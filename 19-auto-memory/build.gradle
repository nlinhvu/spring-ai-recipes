description = '15-ask-user-question'

dependencies {
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'

    implementation 'org.springaicommunity:spring-ai-agent-utils'
    implementation 'org.springaicommunity:spring-ai-session'

    implementation 'org.springaicommunity:spring-ai-inspector-starter'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
