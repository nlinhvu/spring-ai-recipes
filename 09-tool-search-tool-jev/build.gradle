description = '09-tool-search-tool-jev'

dependencies {
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'

    implementation 'org.springframework.ai:spring-ai-vector-store'
    implementation 'org.springframework.ai:spring-ai-tool-search-advisor'

    implementation 'org.springaicommunity:spring-ai-starter-typesafe'
    implementation 'org.springaicommunity:typesafe-spring-ai'

    implementation 'org.springaicommunity:spring-ai-inspector-starter'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
