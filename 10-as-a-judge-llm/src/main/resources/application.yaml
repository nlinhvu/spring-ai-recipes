spring:
  application:
    name: application

  ai:
    openai:
      api-key: ${GEMINI_API_KEY:}
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      chat:
        model: gemini-3.1-flash-lite

    ollama:
      chat:
        model: llama3.2:3b

    chat:
      client:
        enabled: false

    inspector:
      enabled: true